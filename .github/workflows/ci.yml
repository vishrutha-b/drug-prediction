name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 🔒 Secret Scanning — blocks leaked keys/tokens
  # ─────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for leak detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # 🔒 Python Dependency Vulnerability Scan
  # ─────────────────────────────────────────
  python-security:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          # PYSEC-2025-185 and PYSEC-2026-4298: unfixed python-jose CVEs (no upstream fix yet)
          # PYSEC-2026-1325: unfixed ecdsa CVE (transitive dep of python-jose, no fix released)
          pip-audit -r backend/requirements.txt --strict \
            --ignore-vuln PYSEC-2025-185 \
            --ignore-vuln PYSEC-2026-4298 \
            --ignore-vuln PYSEC-2026-1325

  # ─────────────────────────────────────────
  # 🔒 Python SAST — static code security analysis
  # ─────────────────────────────────────────
  python-sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        run: bandit -r backend/app -ll -ii --exit-zero

  # ─────────────────────────────────────────
  # 🔒 Node.js Dependency Vulnerability Scan
  # ─────────────────────────────────────────
  node-security:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        working-directory: frontend
        # --audit-level=high: ignore moderate minimatch vuln in eslint devDeps
        # (fix requires downgrading eslint to v4 which is a breaking change)
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────
  # Backend (FastAPI) Tests
  # ─────────────────────────────────────────
  backend-tests:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest
    needs: [secret-scan, python-security, python-sast]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/ -v --tb=short

  # ─────────────────────────────────────────
  # Frontend (Next.js) Build & Lint
  # ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    needs: [secret-scan, node-security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────
  # 🔒 Docker Image Vulnerability Scan (Trivy)
  # ─────────────────────────────────────────
  docker-scan:
    name: Docker Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: intelliinteraction:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache (prevent unbounded growth)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intelliinteraction:latest
          format: table
          exit-code: 1
          severity: CRITICAL
          trivy-config: trivy.yaml

